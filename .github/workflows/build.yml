name: Build PROCHAN APK

on:
  push:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: Linux-android

      - name: Ensure source-api.aar
        run: |
          if [ ! -f app/libs/source-api.aar ]; then
            echo "Missing source-api.aar in app/libs"
            exit 1
          fi

      - name: Fix manifest round icon
        run: sed -i '/android:roundIcon/d' app/src/main/AndroidManifest.xml

      - name: Build release
        run: |
          chmod +x gradlew
          ./gradlew clean :app:assembleRelease

      - name: Rename APK
        run: |
          SRC=app/build/outputs/apk/release/app-release.apk
          DEST=app/build/outputs/apk/release/Tachiyomi-prochan-1.0.apk
          if [ -f "$SRC" ]; then
            mv "$SRC" "$DEST"
          else
            echo "Release APK not found at $SRC"
            ls -R app/build/outputs || true
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tachiyomi-prochan-1.0.apk
          path: app/build/outputs/apk/release/Tachiyomi-prochan-1.0.apk
