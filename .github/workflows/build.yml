name: Build PROCHAN APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PROCHAN
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Android
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: ${{ runner.os }}-android

      - name: Fix Manifest (remove roundIcon if exists)
        run: sed -i '/android:roundIcon/d' app/src/main/AndroidManifest.xml

      - name: Check source-api.aar
        run: |
          if [ ! -f app/libs/source-api.aar ]; then
            echo "❌ source-api.aar not found in app/libs/"
            exit 1
          fi

      - name: Build APK (release)
        run: |
          chmod +x gradlew
          ./gradlew :app:clean :app:assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PROCHAN-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
